services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campus_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5436}:5432"
    volumes:
      - timescaledb_data_prod:/var/lib/postgresql/data
      - ./init_node_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/${POSTGRES_DB:-campus_db}?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      PORT: 5000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN:-http://localhost:8080}
      PRISMA_DB_PUSH: ${PRISMA_DB_PUSH:-0}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${SCHEDULER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/${POSTGRES_DB:-campus_db}}
      PORT: 5001
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "127.0.0.1:${SCHEDULER_PORT:-5001}:5001"
    depends_on:
      timescaledb:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
      - scheduler

volumes:
  timescaledb_data_prod:
