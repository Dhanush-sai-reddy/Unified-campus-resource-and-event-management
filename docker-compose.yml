services:
  # TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: campus-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_db
    ports:
      - "5436:5432" # Host exposed port (different from 5435 to be safe)
    volumes:
      - timescaledb_data_final:/var/lib/postgresql/data
      - ./init_node_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:alpine
    container_name: campus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: campus-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: campus-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: campus-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Node.js API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: campus-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/campus_db?schema=public
      JWT_SECRET: hackoverflow-secret
      PORT: 5000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      KAFKA_BROKER: kafka:29092
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started

  # Go Scheduler
  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: campus-scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/campus_db
      PORT: 5001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      KAFKA_BROKER: kafka:29092
      REDIS_URL: redis://redis:6379
    ports:
      - "5001:5001"
    depends_on:
      timescaledb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started

  # React Frontend (Nginx)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: campus-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
      - scheduler

volumes:
  timescaledb_data_final:
