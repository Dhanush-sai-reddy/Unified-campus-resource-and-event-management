services:
  # TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: campus-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_db
    ports:
      - "5436:5432" # Host exposed port (different from 5435 to be safe)
    volumes:
      - timescaledb_data_final:/var/lib/postgresql/data
      - ./init_node_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:alpine
    container_name: campus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Node.js API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: campus-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/campus_db?schema=public
      JWT_SECRET: hackoverflow-secret
      PORT: 5000
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started

  # Go Scheduler
  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: campus-scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/campus_db
      PORT: 5001
      REDIS_URL: redis://redis:6379
    ports:
      - "5001:5001"
    depends_on:
      timescaledb:
        condition: service_healthy

  # React Frontend (Nginx)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_USE_MOCKS=${VITE_USE_MOCKS:-false}
    container_name: campus-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
      - scheduler

volumes:
  timescaledb_data_final:
